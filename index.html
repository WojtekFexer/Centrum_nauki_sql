<style>
:root {
  --bg: #0B101B;
  --surface: #131B2E;
  --surface-2: #1B2640;
  --ink: #EEF2F6;
  --muted: #94A3B8;
  --line: #263554;
  --accent: #4F75FF;
  --accent-2: #8B5CF6;
  --accent-ink: #FFFFFF;
  --done: #10B981;
  --done-soft: rgba(16, 185, 129, 0.16);
  --mid: #F59E0B;
  --mid-soft: rgba(245, 158, 11, 0.16);
  --open: #EF4444;
  --open-soft: rgba(239, 68, 68, 0.16);
  --code-bg: #090D16;
  --kw: #7AA8FF;
  --agg: #D98CF0;
  --fn: #4FD1C5;
  --al: #F0A45D;
  --str: #8BD18F;
  --num: #E3C26B;
  --cmt: #64748B;
  --head: 'Bricolage Grotesque', system-ui, sans-serif;
  --body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #F1F5F9;
  --surface: #FFFFFF;
  --surface-2: #E2E8F0;
  --ink: #0F172A;
  --muted: #475569;
  --line: #CBD5E1;
  --accent: #2563EB;
  --accent-2: #7C3AED;
  --accent-ink: #FFFFFF;
  --done: #059669;
  --done-soft: #D1FAE5;
  --mid: #D97706;
  --mid-soft: #FEF3C7;
  --open: #DC2626;
  --open-soft: #FEE2E2;
  --code-bg: #F8FAFC;
  --kw: #1D4ED8;
  --agg: #9333EA;
  --fn: #0D9488;
  --al: #C2410C;
  --str: #15803D;
  --num: #A16207;
  --cmt: #64748B;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
}
body {
  background-image: radial-gradient(800px 320px at 50% -100px, rgba(79, 117, 255, 0.16), transparent);
  padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
}
.app { max-width: 640px; margin: 0 auto; padding: 14px 14px 32px; }

/* Top Bar */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--line);
  padding: 10px 14px; border-radius: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-badge {
  width: 38px; height: 38px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; font: 700 17px var(--head);
  display: grid; place-items: center;
}
.brand-txt b { display: block; font: 700 17px/1.1 var(--head); }
.brand-txt span { font-size: 12px; color: var(--muted); }
.top-stats { display: flex; align-items: center; gap: 8px; }
.pill-stat {
  background: var(--surface-2); border: 1px solid var(--line);
  padding: 5px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 4px;
}

/* Cards & Buttons */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px; margin-bottom: 14px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
}
.hero {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff; border-radius: 20px; padding: 18px; margin-bottom: 14px;
  box-shadow: 0 10px 26px rgba(79, 117, 255, 0.28);
}
.hero h2 { margin: 0 0 6px; font: 600 13px var(--body); text-transform: uppercase; letter-spacing: .05em; opacity: .9; }
.hero p { margin: 0 0 12px; font: 700 20px/1.25 var(--head); }
.hero .sub-hero { font-size: 13px; opacity: .9; margin-bottom: 14px; }

h2 { font: 700 18px/1.25 var(--head); margin: 0 0 10px; }
h3 { font: 600 15px/1.3 var(--head); margin: 14px 0 6px; }
p { margin: 0 0 10px; }
.small { font-size: 13px; }
.muted { color: var(--muted); }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn {
  font: 600 14px var(--body); padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  cursor: pointer; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform .1s ease, border-color .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.success { background: var(--done); border-color: var(--done); color: #fff; }
.btn.warn { background: var(--mid-soft); border-color: var(--mid); color: var(--mid); }
.btn.ghost { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.3); color: #fff; }
.btn.sm { min-height: 34px; padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

/* Chips & Progress */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px;
}
.chip.done { background: var(--done-soft); color: var(--done); }
.chip.mid { background: var(--mid-soft); color: var(--mid); }
.chip.open { background: var(--open-soft); color: var(--open); }
.chip.info { background: var(--surface-2); color: var(--kw); border: 1px solid var(--line); }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--done)); transition: width .4s ease; }

/* Path Nodes (SoloLearn / SQLBolt style) */
.stage-card {
  border-left: 3px solid var(--line); margin-left: 10px; padding-left: 14px; margin-bottom: 16px;
}
.stage-card.unlocked { border-left-color: var(--accent); }
.stage-card.completed { border-left-color: var(--done); }
.node-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.node-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line);
  cursor: pointer; text-align: left; width: 100%; color: var(--ink);
}
.node-item:hover, .node-item.active { border-color: var(--accent); }
.node-item.locked { opacity: .55; }
.node-title { font-weight: 600; font-size: 14px; display: block; }
.node-meta { font-size: 12px; color: var(--muted); }

/* Mobile SQL Quick-Bar & Schema Pills */
.quickbar {
  display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 8px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.quickbar::-webkit-scrollbar { display: none; }
.qbtn {
  flex: none; font: 600 12px var(--mono); padding: 6px 10px;
  border-radius: 8px; background: var(--surface-2); color: var(--kw);
  border: 1px solid var(--line); cursor: pointer;
}
.qbtn.col { color: var(--al); }
.qbtn:active { background: var(--accent); color: #fff; }

/* Dual-layer SQL Editor (iOS Ergonomic) */
.ed {
  display: flex; border: 1px solid var(--line); border-radius: 12px;
  background: var(--code-bg); overflow: hidden; margin-top: 4px;
}
.ed:focus-within { border-color: var(--accent); outline: 2px solid var(--accent); }
#sqlgut, #sqlhl, #answer {
  font: 13.5px/1.6 var(--mono); letter-spacing: 0; word-spacing: 0;
}
#sqlgut {
  padding: 12px 8px; text-align: right; color: var(--muted);
  user-select: none; border-right: 1px solid var(--line); min-width: 2.5em;
  background: rgba(255,255,255,0.02);
}
.edwrap { position: relative; flex: 1; min-width: 0; }
#sqlhl, #answer { margin: 0; padding: 12px; border: 0; white-space: pre; tab-size: 2; }
#sqlhl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; color: var(--ink); }
#answer {
  position: relative; display: block; width: 100%; min-height: 135px;
  outline: 0; resize: none; background: transparent; color: transparent;
  caret-color: var(--ink); overflow-x: auto; overflow-y: hidden;
  -webkit-appearance: none;
}
#answer::selection { background: rgba(79, 117, 255, 0.32); }
.t-kw { color: var(--kw); font-weight: 600; }
.t-agg { color: var(--agg); font-weight: 600; }
.t-fn { color: var(--fn); }
.t-al { color: var(--al); }
.t-str { color: var(--str); }
.t-num { color: var(--num); }
.t-cmt { color: var(--cmt); font-style: italic; }
.t-bad { background: var(--open); color: #fff; }

/* Result Tables */
.tblwrap {
  overflow-x: auto; margin: 8px 0; border: 1px solid var(--line);
  border-radius: 10px; background: var(--code-bg); max-height: 240px;
}
.tblwrap table { border-collapse: collapse; width: 100%; font: 12.5px/1.4 var(--mono); }
.tblwrap th, .tblwrap td {
  padding: 6px 10px; text-align: left; white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
.tblwrap th { background: var(--surface-2); color: var(--kw); font-weight: 600; position: sticky; top: 0; }
.tblwrap tr:last-child td { border-bottom: 0; }

/* Feedback Boxes */
.fb-box {
  border-radius: 12px; padding: 12px 14px; margin-top: 12px;
  border: 1px solid var(--line); background: var(--surface-2);
}
.fb-box.ok { border-color: var(--done); background: var(--done-soft); }
.fb-box.trap { border-color: var(--open); background: var(--open-soft); }
.fb-box.warn { border-color: var(--mid); background: var(--mid-soft); }

/* Bottom Navigation */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20;
}
.tabs nav { max-width: 640px; margin: 0 auto; display: flex; }
.tab {
  flex: 1; background: none; border: 0; border-top: 3px solid transparent;
  color: var(--muted); font: 600 11px var(--body); padding: 9px 2px 10px;
  cursor: pointer; text-align: center;
}
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
.tab svg { display: block; margin: 0 auto 3px; }
.bdg-cnt {
  display: inline-block; padding: 0 5px; border-radius: 99px;
  background: var(--open); color: #fff; font-size: 10px; margin-left: 3px;
}

/* Inputs */
input[type=text], input[type=password], select, textarea.std {
  width: 100%; font: 400 14px var(--body); padding: 9px 12px;
  border-radius: 10px; border: 1px solid var(--line);
  background: var(--code-bg); color: var(--ink); margin-top: 4px;
}
#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(74px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); font-weight: 600;
  padding: 10px 16px; border-radius: 12px; font-size: 13px;
  z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s;
}
#toast.show { opacity: 1; }
</style>
</head>

// Transpiler pozwalający pisać składnią PostgreSQL w silniku SQLite (WASM)
function pgToSqlite(sql) {
  var s = String(sql || '').trim();
  // ::numeric / ::float / ::real -> CAST
  s = s.replace(/\b([a-zA-Z0-9_.)]+)\s*::\s*(numeric|decimal|float|real)/gi, 'CAST($1 AS REAL)');
  s = s.replace(/\b([a-zA-Z0-9_.)]+)\s*::\s*(int|integer|bigint)/gi, 'CAST($1 AS INTEGER)');
  s = s.replace(/\b([a-zA-Z0-9_.)]+)\s*::\s*(text|varchar|date)/gi, 'CAST($1 AS TEXT)');
  // ILIKE -> LIKE (w SQLite LIKE dla ASCII jest domyślnie case-insensitive)
  s = s.replace(/\bILIKE\b/gi, 'LIKE');
  // DATE_TRUNC('month', col) -> substr(col, 1, 7)
  s = s.replace(/DATE_TRUNC\s*\(\s*'month'\s*,\s*([^)]+)\)/gi, "substr($1, 1, 7)");
  return s;
}

async function initDatabase() {
  var statusEl = document.getElementById('dbStatus');
  try {
    if (typeof initSqlJs === 'undefined') throw new Error('Brak biblioteki SQL.js');
    var SQL = await initSqlJs({
      locateFile: function(file) { return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + file; }
    });
    db = new SQL.Database();
    db.run(DVDRENTAL_SEED_SQL);
    dbReady = true;
    if (statusEl) statusEl.textContent = 'Silnik dvdrental (WASM) gotowy · Offline OK';
    render();
  } catch (err) {
    if (statusEl) statusEl.textContent = 'Tryb zapasowy (sprawdź połączenie z CDN)';
  }
}

function runQuery(sql) {
  if (!dbReady || !db) return { error: 'Silnik bazy danych jeszcze się ładuje.' };
  var clean = pgToSqlite(sql);
  if (!clean) return { error: 'Wpisz zapytanie SQL.' };
  try {
    var res = db.exec(clean);
    if (!res || !res.length) return { columns: [], values: [] };
    return { columns: res[0].columns, values: res[0].values };
  } catch (e) {
    return { error: e.message || String(e) };
  }
}

// Porównywarka tabel wynikowych (Grader porównujący wynik ucznia z zapytaniem wzorcowym)
function compareResults(userRes, expRes, checkOrder) {
  if (userRes.error) return { ok: false, reason: 'error', msg: 'Błąd składni SQL: ' + userRes.error };
  var uRows = userRes.values || [], eRows = expRes.values || [];
  var uCols = userRes.columns || [], eCols = expRes.columns || [];

  if (uCols.length !== eCols.length) {
    return {
      ok: false, reason: 'cols',
      msg: 'Zwrócono ' + uCols.length + ' kolumn (' + uCols.join(', ') + '), a oczekiwano ' + eCols.length + ' kolumn (' + eCols.join(', ') + ').'
    };
  }
  if (uRows.length !== eRows.length) {
    return {
      ok: false, reason: 'rows',
      msg: 'Twoje zapytanie zwróciło ' + uRows.length + ' wierszy, a poprawny wynik na bazie dvdrental ma ' + eRows.length + ' wierszy.'
    };
  }
  function normCell(v) {
    if (v === null || v === undefined) return 'NULL';
    if (typeof v === 'number') return Number(v.toFixed(2)).toString();
    var num = Number(v);
    if (!isNaN(num) && String(v).trim() !== '') return Number(num.toFixed(2)).toString();
    return String(v).trim().toUpperCase();
  }
  function normRow(r) { return r.map(normCell).join('|'); }

  var uNorm = uRows.map(normRow);
  var eNorm = eRows.map(normRow);
  if (!checkOrder) {
    uNorm = uNorm.slice().sort();
    eNorm = eNorm.slice().sort();
  }
  for (var i = 0; i < eNorm.length; i++) {
    if (uNorm[i] !== eNorm[i]) {
      return {
        ok: false, reason: 'values',
        msg: 'Wartości w wierszu #' + (i + 1) + ' różnią się od wzorca. Twój wiersz: [' + uRows[i].join(', ') + '], oczekiwano: [' + eRows[i].join(', ') + '].'
      };
    }
  }
  return { ok: true, msg: 'Idealnie! Wynik zapytania w 100% zgadza się z bazą dvdrental.' };
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {

}

}

var SQL_KW = new Set('select from where join left right inner outer on group by order having with as and or not null in is case when then else end over partition desc asc distinct limit between like ilike union all exists coalesce cast row_number rank dense_rank'.split(' '));
var SQL_AGG = new Set(['sum','count','avg','min','max']);
var SQL_TOK = /(--[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^']|'')*(?:'|$))|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|([\u2018\u2019\u201A\u201B\u201C\u201D])|([\s\S])/g;

function sqlUpdate() {
  var code = document.getElementById('answer');
  if (!code) return;
  var gut = document.getElementById('sqlgut'), hl = document.getElementById('sqlhl');
  var t = code.value, n = t.split('\n').length, s = '';
  for (var i = 1; i <= n; i++) s += i + (i < n ? '\n' : '');
  gut.textContent = s;
  code.style.height = 'auto';
  code.style.height = Math.max(135, code.scrollHeight + 4) + 'px';

  var out = '', m;
  SQL_TOK.lastIndex = 0;
  while ((m = SQL_TOK.exec(t))) {
    var x = m[0], c = null;
    if (m[1]) c = 'cmt';
    else if (m[2]) c = 'str';
    else if (m[3]) c = 'num';
    else if (m[5]) c = 'bad';
    else if (m[4]) {
      var w = x.toLowerCase();
      if (SQL_AGG.has(w)) c = 'agg';
      else if (SQL_KW.has(w)) c = 'kw';
    }
    out += c ? '<span class="t-' + c + '">' + esc(x) + '</span>' : esc(x);
  }
  if (t.slice(-1) === '\n') out += ' ';
  hl.innerHTML = out;
  hl.scrollTop = code.scrollTop;
  hl.scrollLeft = code.scrollLeft;
}

function insertAtCursor(snippet) {
  var ta = document.getElementById('answer');
  if (!ta) return;
  var start = ta.selectionStart || 0, end = ta.selectionEnd || 0;
  var val = ta.value;
  var pad = (start > 0 && !/[\s(.]/.test(val[start - 1]) && !/^[,);']/.test(snippet)) ? ' ' : '';
  ta.value = val.slice(0, start) + pad + snippet + val.slice(end);
  var pos = start + pad.length + snippet.length;
  ta.focus();
  ta.setSelectionRange(pos, pos);
  state.editorCode = ta.value;
  sqlUpdate();
  saveState();
}

    '<p class="small muted">Po podpięciu darmowej bazy Supabase w kolejnym etapie, Twoje punkty XP z zadań dvdrental i DataLemur będą synchronizowane z globalną tablicą wyników:</p>' +
    '<div class="tblwrap"><table><thead><tr><th>#</th><th>Użytkownik</th><th>Etap</th><th>XP</th><th>Seria</th></tr></thead><tbody>' +
      '<tr><td>1</td><td><strong>Anna_Data</strong></td><td>Etap 5</td><td>1 540 XP</td><td>🔥 9d</td></tr>' +
      '<tr style="background:var(--done-soft)"><td>2</td><td><strong>' + esc(state.nickname) + ' (Ty)</strong></td><td>Etap ' + state.unlockedStage + '</td><td><strong>' + state.xp + ' XP</strong></td><td>🔥 ' + state.streak + 'd</td></tr>' +
      '<tr><td>3</td><td><strong>Marek_BI</strong></td><td>Etap 3</td><td>980 XP</td><td>🔥 3d</td></tr>' +
    '</tbody></table></div>' +
    '<div class="acts"><button class="btn sm" data-act="exportJson">⬇ Eksportuj pełny stan (.json)</button></div>' +
  '</div>';
}

/* ==========================================================================
   8. OBSŁUGA ZDARZEŃ I AKCJI
   ========================================================================== */
function updateHeader() {
  var xpEl = document.getElementById('xpPill');
  var stEl = document.getElementById('streakPill');
  var bdg = document.getElementById('gapBdg');
  if (xpEl) xpEl.textContent = '⚡ ' + state.xp + ' XP';
  if (stEl) stEl.textContent = '🔥 ' + state.streak + 'd';
  var openGaps = state.gaps.filter(function(g) { return g.lvl <= 1; }).length;
  if (bdg) bdg.innerHTML = openGaps ? '<span class="bdg-cnt">' + openGaps + '</span>' : '';
}

function render() {
  document.documentElement.setAttribute('data-theme', state.theme || 'dark');
  updateHeader();
  var v = document.getElementById('view');
  if (!v) return;
  v.innerHTML = currentTab === 'path' ? renderPathTab()
              : currentTab === 'diag' ? renderDiagTab()
              : currentTab === 'lemur' ? renderLemurTab()
              : currentTab === 'schema' ? renderSchemaTab()
              : renderProfileTab();

  document.querySelectorAll('.tab').forEach(function(b) {
    if (b.dataset.tab === currentTab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });

  var code = document.getElementById('answer');
  if (code) {
    code.addEventListener('scroll', function() {
      var hl = document.getElementById('sqlhl');
      if (hl) { hl.scrollTop = code.scrollTop; hl.scrollLeft = code.scrollLeft; }
    });
    sqlUpdate();
  }
}

document.addEventListener('input', function(e) {
  if (e.target.id === 'answer') {
    state.editorCode = e.target.value;
    sqlUpdate();
    saveState();
  }
});

document.addEventListener('click', async function(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.dataset.act;

  if (act === 'tab') {
    currentTab = el.dataset.tab;
    lastFeedback = null;
    if (currentTab === 'diag' && state.diagIdx < DIAG_QUESTIONS.length) {
      state.editorCode = '-- Zadanie diagnostyczne #' + (state.diagIdx + 1) + '\nSELECT ';
    }
    render();
    window.scrollTo(0, 0);
  }
  else if (act === 'theme') {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    saveState();
    render();
  }
  else if (act === 'ins') {
    insertAtCursor(el.dataset.val);
  }
  else if (act === 'clearEd') {
    state.editorCode = '';
    lastExecResult = null;
    lastFeedback = null;
    render();
  }
  else if (act === 'runOnly') {
    lastExecResult = runQuery(state.editorCode);
    lastFeedback = null;
    render();
  }
  else if (act === 'pickPathTask') {
    state.activeTaskId = el.dataset.id;
    state.activeVariantIdx = 0;
    var t = PATH_TASKS.find(function(x) { return x.id === state.activeTaskId; });
    if (t) state.editorCode = '-- ' + t.title + '\nSELECT ';
    lastExecResult = null;
    lastFeedback = null;
    saveState();
    render();
    window.scrollTo(0, 0);
  }
  else if (act === 'shuffleVariant') {
    state.activeVariantIdx++;
    lastExecResult = null;
    lastFeedback = { type: 'warn', title: 'Wylosowano nowy wariant zadania!', msg: 'Zmieniliśmy warunki lub tabelę docelową. Napisz zapytanie dla nowej treści.' };
    saveState();
    render();
  }
  else if (act === 'checkPathTask') {
    var task = PATH_TASKS.find(function(t) { return t.id === state.activeTaskId; }) || PATH_TASKS[0];
    var variant = task.variants[state.activeVariantIdx % task.variants.length];
    lastExecResult = runQuery(state.editorCode);
    var expRes = runQuery(variant.sol);
    var cmp = compareResults(lastExecResult, expRes, variant.order);
    if (cmp.ok) {
      if (!state.completedTasks[task.id]) {
        state.completedTasks[task.id] = true;
        state.xp += 25;
      } else {
        state.xp += 5;
      }
      if (task.stage >= state.unlockedStage && state.unlockedStage < 5) {
        state.unlockedStage = task.stage + 1;
      }
      lastFeedback = { type: 'ok', title: '✅ Zadanie zaliczone! (+XP)', msg: cmp.msg };
      saveState();
    } else {
      if (task.gapId) registerGapTrap(task.gapId, task.title, cmp.msg);
      lastFeedback = { type: 'trap', title: '❌ Wynik różni się od oczekiwanego', msg: cmp.msg };
    }
    render();
  }
  else if (act === 'showSolution') {
    var task2 = PATH_TASKS.find(function(t) { return t.id === state.activeTaskId; }) || PATH_TASKS[0];
    var variant2 = task2.variants[state.activeVariantIdx % task2.variants.length];
    state.editorCode = variant2.sol;
    lastExecResult = runQuery(variant2.sol);
    lastFeedback = { type: 'warn', title: 'Wzorcowe rozwiązanie wczytane do edytora', msg: 'Przeanalizuj zapytanie, a następnie kliknij "Wylosuj inny wariant", aby rozwiązać podobny przypadek samodzielnie!' };
    render();
  }
  else if (act === 'submitDiag') {
    var dq = DIAG_QUESTIONS[state.diagIdx];
    lastExecResult = runQuery(state.editorCode);
    var dExp = runQuery(dq.sol);
    var dCmp = compareResults(lastExecResult, dExp, dq.order);
    if (dCmp.ok) {
      state.diagScore++;
      state.xp += 15;
      toast('Dobrze! Przechodzisz do kolejnego pytania Diagnozy.');
      state.diagIdx++;
      lastExecResult = null;
      lastFeedback = null;
      if (state.diagIdx < DIAG_QUESTIONS.length) {
        state.editorCode = '-- Zadanie diagnostyczne #' + (state.diagIdx + 1) + '\nSELECT ';
      }
      saveState();
      render();
    } else {
      lastFeedback = { type: 'trap', title: 'Wynik jeszcze niepoprawny', msg: dCmp.msg + ' Możesz poprawić kod lub kliknąć "Pomiń zadanie".' };
      render();
    }
  }
  else if (act === 'skipDiag') {
    var sq = DIAG_QUESTIONS[state.diagIdx];
    state.diagSkipped.push(sq.lvl);
    registerGapTrap(sq.gap, sq.title, 'Zadanie pominięte podczas Diagnozy poziomującej.');
    state.diagIdx++;
    lastExecResult = null;
    lastFeedback = null;
    if (state.diagIdx < DIAG_QUESTIONS.length) {
      state.editorCode = '-- Zadanie diagnostyczne #' + (state.diagIdx + 1) + '\nSELECT ';
    }
    saveState();
    render();
  }
  else if (act === 'applyDiag') {
    var st = Number(el.dataset.stage) || 1;
    state.unlockedStage = st;
    state.diagDone = true;
    PATH_TASKS.forEach(function(pt) {
      if (pt.stage < st) state.completedTasks[pt.id] = true;
    });
    var firstInStage = PATH_TASKS.find(function(pt) { return pt.stage === st; }) || PATH_TASKS[0];
    state.activeTaskId = firstInStage.id;
    state.editorCode = '-- Start od Etapu ' + st + '\nSELECT ';
    currentTab = 'path';
    saveState();
    render();
    toast('Odblokowano Etap ' + st + ' w Ścieżce!');
  }
  else if (act === 'resetDiag') {
    state.diagIdx = 0;
    state.diagScore = 0;
    state.diagSkipped = [];
    state.editorCode = '-- Zadanie diagnostyczne #1\nSELECT ';
    saveState();
    render();
  }
  else if (act === 'pickLemur') {
    state.activeLemurId = el.dataset.id;
    state.editorCode = '-- Zadanie rekrutacyjne DataLemur\nSELECT ';
    lastExecResult = null;
    lastFeedback = null;
    saveState();
    render();
  }
  else if (act === 'checkLemurTask') {
    var lt = LEMUR_TASKS.find(function(x) { return x.id === state.activeLemurId; }) || LEMUR_TASKS[0];
    lastExecResult = runQuery(state.editorCode);
    var lExp = runQuery(lt.sol);
    var lCmp = compareResults(lastExecResult, lExp, false);
    if (lCmp.ok) {
      state.xp += 40;
      lastFeedback = { type: 'ok', title: '🏆 Brawo! Ominąłeś pułapkę rekrutacyjną (+40 XP)', msg: lCmp.msg };
      saveState();
    } else {
      var trapMsg = lt.detectTrap ? lt.detectTrap(state.editorCode, lastExecResult) : null;
      registerGapTrap(lt.gapId, lt.gapName, lt.gapHint);
      lastFeedback = {
        type: 'trap',
        title: trapMsg ? '⚠️ Wpadłeś w pułapkę rekrutacyjną!' : '❌ Wynik niezgodny z wzorcem',
        msg: (trapMsg ? trapMsg + '\n\n' : '') + lCmp.msg + ' (Luka "' + lt.gapName + '" została zaktualizowana w Twoim Rejestrze Luk).'
      };
    }
    render();
  }
  else if (act === 'previewTable') {
    var tbl = el.dataset.table;
    state.editorCode = 'SELECT * FROM ' + tbl + ' LIMIT 10;';
    lastExecResult = runQuery(state.editorCode);
    lastFeedback = null;
    render();
  }
  else if (act === 'saveConfig') {
    var prov = document.getElementById('aiProvSel');
    var key = document.getElementById('apiKeyInp');
    if (prov) state.aiProvider = prov.value;
    if (key) state.apiKey = key.value.trim();
    saveState();
    toast('Zapisano konfigurację AI.');
  }
  else if (act === 'aiHint') {
    if (state.aiProvider === 'gemini' && state.apiKey) {
      toast('Wysyłam zapytanie do Gemini API…');
      try {
        var resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(state.apiKey), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: 'Jesteś mentorem SQL. Daj krótką, 2-zdaniową wskazówkę po polsku (bez podawania gotowego kodu) do obecnego kodu ucznia: ' + state.editorCode }] }]
          })
        });
        var data = await resp.json();
        var txt = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text;
        lastFeedback = { type: 'warn', title: '🤖 Wskazówka Gemini AI', msg: txt || 'Sprawdź warunki w WHERE i nazwy kolumn.' };
      } catch (err) {
        lastFeedback = { type: 'trap', title: 'Błąd połączenia z API', msg: 'Sprawdź swój klucz API w zakładce Konto & AI.' };
      }
    } else {
      lastFeedback = {
        type: 'warn',
        title: '💡 Wskazówka lokalnego mentora (Offline)',
        msg: 'Sprawdź pigułki kolumn nad edytorem. Upewnij się, że zwracasz dokładnie te kolumny, o które prosi treść zadania, a przy dzieleniu procentowym używasz * 100.0.'
      };
    }
    render();
  }
  else if (act === 'exportJson') {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sql-master-backup.json';
    a.click();
    toast('Pobrano plik kopii zapasowej JSON.');
  }
});

render();
initDatabase();
})();
</script>
