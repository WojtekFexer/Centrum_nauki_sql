<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SQL Master">
<title>SQL Master · dvdrental Mobile LMS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">SQL</div>
      <div class="brand-txt">
        <b>SQL Master · dvdrental</b>
        <span><i class="dot-online"></i> <span id="dbStatus">Ładowanie silnika SQL…</span></span>
      </div>
    </div>
    <div class="top-stats">
      <span class="pill-stat" id="xpPill">⚡ 1202 XP</span>
      <span class="pill-stat" id="streakPill">🔥 4d</span>
      <button class="btn sm" data-act="theme" title="Zmień motyw">🌓</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>
</div>

<div class="tabs">
  <nav aria-label="Główna nawigacja">
    <button class="tab" data-act="tab" data-tab="path" aria-current="page">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Ścieżka (120)
    </button>
    <button class="tab" data-act="tab" data-tab="diag">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Diagnoza (10)
    </button>
    <button class="tab" data-act="tab" data-tab="lemur">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Rekrutacja (60)<span id="gapBdg"></span>
    </button>
    <button class="tab" data-act="tab" data-tab="schema">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
      Baza dvdrental
    </button>
    <button class="tab" data-act="tab" data-tab="profile">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Konto & AI
    </button>
  </nav>
</div>

<div id="toast" role="status"></div>

<script src="js/data-dvdrental.js"></script>
<script src="js/data-tasks.js"></script>
<script src="js/data-interview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
